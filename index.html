<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WING AI</title>
<style>
  :root{--bg:#09090b;--card:#131316;--line:#26262c;--text:#ececf1;--mute:#8b8b96;--gold:#c9a45c;--gold2:#e8cf94}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:20px 16px 60px}
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  h1{font-size:22px;letter-spacing:6px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;color:transparent}
  h1 small{display:block;font-size:10px;letter-spacing:3px;color:var(--mute);-webkit-text-fill-color:var(--mute);font-weight:400;margin-top:2px}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
  .icon-btn:hover{color:var(--gold);border-color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
  textarea,input,select{width:100%;background:#0c0c0f;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus,select:focus{border-color:var(--gold)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .mt{margin-top:12px}
  .go{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111;font-weight:700;font-size:15px;letter-spacing:2px;cursor:pointer}
  .go:disabled{opacity:.5;cursor:wait}
  .shot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mute)}
  .shot img{height:48px;border-radius:8px;border:1px solid var(--line)}
  .shot button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px}
  .msg{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin-bottom:14px}
  .msg.best{background:rgba(201,164,92,.07);border-radius:0 10px 10px 0;padding:10px 12px}
  .msg .tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
  .msg p{font-size:16px;line-height:1.45}
  .copy{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:3px 9px;font-size:11px;cursor:pointer}
  .copy:hover{color:var(--gold);border-color:var(--gold)}
  .reco{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.4}
  .err{color:#ff7a7a;font-size:14px;margin-top:10px}
  .hint{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.4}
  .hist{font-size:13px;color:var(--mute);padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .hist:hover{color:var(--text)}
  .hidden{display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #111;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WING AI<small>TON WINGMAN IA</small></h1>
    <button class="icon-btn" id="setBtn">⚙ Clé Groq</button>
  </header>

  <div class="card hidden" id="settings">
    <label>Clé API Groq</label>
    <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
    <div class="row mt">
      <div><label>Modèle texte (vide = auto)</label><input id="model" placeholder="auto (détecté depuis ta clé)"></div>
      <div><label>Modèle image (vide = auto)</label><input id="vmodel" placeholder="auto (détecté depuis ta clé)"></div>
    </div>
    <button class="go" id="saveKey" style="margin-top:12px">ENREGISTRER</button>
    <div class="hint">La clé reste uniquement dans ton navigateur (localStorage) et n'est envoyée qu'à api.groq.com. Ne mets jamais ta clé dans un fichier public sur GitHub.</div>
  </div>

  <div class="card">
    <label>Son message / la situation</label>
    <textarea id="ctx" placeholder="Colle ici son dernier message, ou explique la situation (ex : elle ne répond plus depuis 2 jours, première conversation sur Instagram, elle m'a dit « haha tu es fou »…)"></textarea>

    <div class="shot hidden" id="shotBox"><img id="shotImg"><span>Capture jointe</span><button id="shotDel">retirer</button></div>
    <div class="row mt">
      <div><label>Son prénom (optionnel)</label><input id="name" placeholder="Ann, Tracy…"></div>
      <div><label>Langue</label>
        <select id="lang"><option value="français">Français</option><option value="créole haïtien">Kreyòl</option><option value="anglais">English</option></select>
      </div>
    </div>
    <div class="row mt">
      <input type="file" id="file" accept="image/*" class="hidden">
      <button class="icon-btn" id="fileBtn" style="width:100%">📷 Ajouter une capture de conversation</button>
    </div>
    <button class="go" id="go">GÉNÉRER</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card hidden" id="out"></div>
  <div class="card hidden" id="histCard"><label>Historique</label><div id="hist"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let image=null;

$('key').value=ls.get('wing_key')||'';
$('model').value=ls.get('wing_model')||'';
$('vmodel').value=ls.get('wing_vmodel')||'';
if(!$('key').value)$('settings').classList.remove('hidden');

$('setBtn').onclick=()=>$('settings').classList.toggle('hidden');
$('saveKey').onclick=()=>{ls.set('wing_key',$('key').value.trim());ls.set('wing_model',$('model').value.trim());ls.set('wing_vmodel',$('vmodel').value.trim());$('settings').classList.add('hidden')};

$('fileBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{ // réduit l'image pour rester léger
    const m=1280,r=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    image=c.toDataURL('image/jpeg',.8);$('shotImg').src=image;$('shotBox').classList.remove('hidden');URL.revokeObjectURL(url);
  };img.src=url;
};
$('shotDel').onclick=()=>{image=null;$('shotBox').classList.add('hidden');$('file').value=''};

const SYSTEM=`Tu es WING AI, un coach de séduction et de texto pour un homme (Mike, Haïti). Tu écris des messages prêts à envoyer à une femme.
Règles :
- Messages COURTS (1 à 2 phrases max), naturels, comme un vrai texto, pas de style robotique, pas de longs paragraphes.
- Respectueux : jamais de pression, de manipulation, de culpabilisation ni de contenu sexuel explicite. Si elle semble désintéressée ou dit non, recommande de laisser tomber avec classe.
- Tiens compte de son dernier message et du contexte. Reste dans la langue demandée.
- Génère EXACTEMENT 4 versions, une par style :
  1. flirt_subtil : charme léger, compliment indirect, sourire dans le texte
  2. non_chalant : décontracté, confiant, peu d'effort apparent
  3. intriguant : crée de la curiosité, pose un petit défi ou une question qui donne envie de répondre
  4. mysterieux : court, évocateur, en dit moins pour donner envie d'en savoir plus
- Choisis UNE recommandation claire parmi les 4 et explique pourquoi en une phrase.
Réponds UNIQUEMENT en JSON valide : {"flirt_subtil":"...","non_chalant":"...","intriguant":"...","mysterieux":"...","recommandation":"flirt_subtil|non_chalant|intriguant|mysterieux","pourquoi":"..."}`;


async function groq(key,path,opts){
  const r=await fetch('https://api.groq.com/openai/v1/'+path,Object.assign({headers:{'Content-Type':'application/json','Authorization':'Bearer '+key}},opts||{}));
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
  return j;
}
async function autoModel(key,vision,force){
  const j=await groq(key,'models');
  const ids=j.data.map(m=>m.id).filter(id=>!/whisper|tts|guard|embed|safeguard|prompt-guard|compound|orpheus/i.test(id));
  let pick;
  if(vision){
    pick=ids.find(i=>/llama-4-(scout|maverick)/.test(i))||ids.find(i=>/vision/i.test(i));
    if(!pick)throw new Error("Aucun modèle image trouvé sur ta clé Groq. Écris le message sans capture.");
  }else{
    const pref=[/gpt-oss-120b/,/llama-3\.3-70b/,/qwen.*(32b|27b)/,/kimi/,/gpt-oss-20b/,/llama-3\.1-8b/];
    for(const re of pref){pick=ids.find(i=>re.test(i));if(pick)break}
    if(!pick)pick=ids[0];
    if(!pick)throw new Error("Aucun modèle disponible sur ta clé.");
  }
  ls.set(vision?'wing_vmodel':'wing_model',pick);
  $(vision?'vmodel':'model').value=pick;
  return pick;
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);
  throw new Error('Réponse illisible, réessaie.');
}
async function ask(key,model,messages){
  const base={model,temperature:.9,max_tokens:2500,messages};
  let j;
  try{j=await groq(key,'chat/completions',{method:'POST',body:JSON.stringify(Object.assign({response_format:{type:'json_object'}},base))})}
  catch(e){
    if(/response_format|json/i.test(e.message))j=await groq(key,'chat/completions',{method:'POST',body:JSON.stringify(base)});
    else throw e;
  }
  return parseJSON(j.choices[0].message.content||'');
}

const LABELS={flirt_subtil:'Flirt subtil',non_chalant:'Non chalant',intriguant:'Intriguant',mysterieux:'Mystérieux'};

$('go').onclick=async()=>{
  const key=ls.get('wing_key');
  $('err').textContent='';
  if(!key){$('settings').classList.remove('hidden');$('err').textContent='Ajoute ta clé Groq d\'abord.';return}
  const ctx=$('ctx').value.trim();
  if(!ctx&&!image){$('err').textContent='Colle un message ou ajoute une capture.';return}

  const userText=`Langue des messages : ${$('lang').value}.\n`+($('name').value?`Prénom d'elle : ${$('name').value}.\n`:'')+`Contexte / son message :\n${ctx||'(voir la capture)'}`;
  const useImg=!!image;
  const content=useImg?[{type:'text',text:userText+'\nLa capture jointe montre la conversation.'},{type:'image_url',image_url:{url:image}}]:userText;
  const messages=[{role:'system',content:SYSTEM},{role:'user',content}];

  $('go').disabled=true;$('go').innerHTML='<span class="spin"></span>GÉNÉRATION…';
  try{
    let model=(useImg?$('vmodel').value:$('model').value).trim();
    if(!model)model=await autoModel(key,useImg);
    let res;
    try{res=await ask(key,model,messages)}
    catch(e){
      if(/does not exist|not have access|decommission|model_not_found|no longer supported/i.test(e.message)){
        model=await autoModel(key,useImg,true); // le modèle a changé : on re-détecte
        res=await ask(key,model,messages);
      }else throw e;
    }
    render(res);save(ctx||'(capture)',res);
  }catch(e){$('err').textContent='Erreur : '+e.message}
  $('go').disabled=false;$('go').textContent='GÉNÉRER';
};

function render(d){
  const best=d.recommandation;
  let h='';
  for(const k of Object.keys(LABELS)){
    if(!d[k])continue;
    h+=`<div class="msg${k===best?' best':''}"><div class="tag"><span>${LABELS[k]}${k===best?' ★':''}</span><button class="copy" data-t="${esc(d[k])}">Copier</button></div><p>${esc(d[k])}</p></div>`;
  }
  h+=`<div class="reco"><b style="color:var(--gold)">Recommandé : ${LABELS[best]||best}</b> — ${esc(d.pourquoi||'')}</div>`;
  $('out').innerHTML=h;$('out').classList.remove('hidden');
  $('out').querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.t);b.textContent='Copié ✓';setTimeout(()=>b.textContent='Copier',1200)});
  $('out').scrollIntoView({behavior:'smooth'});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function save(ctx,d){
  let h=[];try{h=JSON.parse(ls.get('wing_hist')||'[]')}catch(e){}
  h.unshift({ctx:ctx.slice(0,80),d});h=h.slice(0,15);ls.set('wing_hist',JSON.stringify(h));showHist();
}
function showHist(){
  let h=[];try{h=JSON.parse(ls.get('wing_hist')||'[]')}catch(e){}
  if(!h.length)return;
  $('histCard').classList.remove('hidden');
  $('hist').innerHTML=h.map((x,i)=>`<div class="hist" data-i="${i}">${esc(x.ctx)}</div>`).join('');
  $('hist').querySelectorAll('.hist').forEach(el=>el.onclick=()=>render(h[el.dataset.i].d));
}
showHist();
</script>
</body>
</html>
